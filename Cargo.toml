[package]
name = "onelink"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
gethostname = "1.1.0"
gpui-kit = "0.7"
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
